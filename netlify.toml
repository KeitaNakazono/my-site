# keita-works.com のデプロイ設定
# リポジトリ直下をそのまま公開するが、_src はビルド用のソースのため配信しない。

[build]
  publish = "."

# ビルド用ソースを本番ドメインから取得できないようにする
[[redirects]]
  from = "/_src/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/works/thumbs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
